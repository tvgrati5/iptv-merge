name: Update IPTV Master

on:
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis setiap 6 jam sekali
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run merge script
        run: python merge.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update master.m3u" && git push)
